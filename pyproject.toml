[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "insurance-conformal-risk"
version = "0.1.0"
description = "Conformal Risk Control for insurance pricing: distribution-free expected-loss guarantees"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Burning Cost", email = "pricing.frontier@gmail.com" },
]
keywords = [
    "conformal prediction",
    "conformal risk control",
    "insurance",
    "premium sufficiency",
    "expected loss",
    "solvency ii",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "polars>=0.20",
]

[project.optional-dependencies]
sklearn = ["scikit-learn>=1.3"]
catboost = ["catboost>=1.2"]
all = ["scikit-learn>=1.3", "catboost>=1.2"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "scikit-learn>=1.3",
    "numpy>=1.24",
]

[project.urls]
Homepage = "https://github.com/burning-cost/insurance-conformal-risk"
Repository = "https://github.com/burning-cost/insurance-conformal-risk"
Issues = "https://github.com/burning-cost/insurance-conformal-risk/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/insurance_conformal_risk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[dependency-groups]
dev = [
    "databricks-sdk>=0.98.0",
    "pytest>=8.0",
    "scikit-learn>=1.3",
]
